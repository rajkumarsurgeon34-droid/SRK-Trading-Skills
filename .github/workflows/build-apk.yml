name: Build SRK Trading APK

on:
  push:
    branches: [main]
    paths: ['android-app/**', 'india_common/**', '.github/workflows/build-apk.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node (logic tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test app logic against the Python skills
        run: node --test android-app/tests/logic.test.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-app
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: android-app
        shell: bash
        run: |
          grep -E "error:|e: |What went wrong|FAILURE|Exception|Could not|> " build.log | grep -v "^> Task" | head -20 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Check the APK
        working-directory: android-app
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -p "$APK" 'classes*.dex' | grep -a -q 'Lin/shazverse/srktrading/MainActivity;' || { echo 'ERROR: MainActivity missing'; exit 1; }
          unzip -l "$APK" | grep -q 'assets/www/js/app.js' || { echo 'ERROR: app pages missing'; exit 1; }
          cp "$APK" SRK-Trading.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRK-Trading-apk
          path: android-app/SRK-Trading.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v1.0.${{ github.run_number }}" android-app/SRK-Trading.apk \
            --title "SRK Trading 1.0 (build ${{ github.run_number }})" \
            --notes "Download SRK-Trading.apk below and open it on your Android phone to install. Analysis and discipline tool for NSE/BSE — it never places orders."
